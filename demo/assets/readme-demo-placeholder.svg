<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MiniOS demo video placeholder</title>
  <desc id="desc">A placeholder card for the MiniOS demo video link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.55" stop-color="#1b2a34"/>
      <stop offset="1" stop-color="#243b4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.18">
    <rect x="78" y="72" width="1086" height="58" rx="8" fill="#ffffff"/>
    <rect x="78" y="162" width="738" height="26" rx="5" fill="#ffffff"/>
    <rect x="78" y="216" width="926" height="26" rx="5" fill="#ffffff"/>
    <rect x="78" y="270" width="620" height="26" rx="5" fill="#ffffff"/>
    <rect x="78" y="508" width="1086" height="72" rx="8" fill="#ffffff"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="640" cy="360" r="106" fill="#f4f7f8"/>
    <path d="M610 306 L610 414 L704 360 Z" fill="#0f1f2a"/>
  </g>
  <text x="640" y="196" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#f4f7f8">MiniOS Demo Video</text>
  <text x="640" y="466" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#d7e4ea">Click after replacing the placeholder URL</text>
  <text x="640" y="520" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#9fb7c4">Workbench, Shell, TinyFS, scheduling, VM and realtime demo</text>
</svg>
